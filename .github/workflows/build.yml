name: Build and Package CellFlow Data Studio

on:
  push:
    branches:
      - main
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend (PyInstaller onedir)
        run: |
          pyinstaller --distpath packaging/dist --workpath packaging/build packaging/backend.spec

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package.json

      - name: Install UI Dependencies & Build Frontend
        working-directory: ui
        run: |
          npm ci || npm install
          npm run build

      - name: Package Native Installer (electron-builder)
        working-directory: ui
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:linux
          fi
        shell: bash

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellFlow-Data-Studio-${{ matrix.os }}
          path: |
            ui/release/*.exe
            ui/release/*.dmg
            ui/release/*.AppImage
            ui/release/*.deb
          if-no-files-found: warn

